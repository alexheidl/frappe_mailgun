name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install system packages and bench
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev pkg-config
          npm install -g yarn
          pip install frappe-bench

      - name: Set MariaDB charset
        run: |
          mysql --host 127.0.0.1 --port 3306 -uroot -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -uroot -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Init bench
        run: bench init --skip-redis-config-generation --frappe-branch version-16 frappe-bench

      - name: Get the app
        working-directory: frappe-bench
        run: |
          bench get-app frappe_mailgun $GITHUB_WORKSPACE
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6379"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379"

      - name: New site and install
        working-directory: frappe-bench
        run: |
          bench new-site test_site --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%'
          bench --site test_site install-app frappe_mailgun
          bench --site test_site set-config allow_tests true

      - name: Run tests
        working-directory: frappe-bench
        run: bench --site test_site run-tests --app frappe_mailgun
